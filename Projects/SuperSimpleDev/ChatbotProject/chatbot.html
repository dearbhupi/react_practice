<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <input
              type="text"
              placeholder="Send a message to Chatbot..."
              size="30"
            />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ msg, sender }) {
        return (
          <div>
            {sender === "robot" && (
              <img src="./Images/robot.png" alt="robot" width="50" />
            )}
            {/* the above statment is called gaurd operator in react which mean if left side is true, the right side will be rendered */}
            {msg}
            {sender === "user" && (
              <img src="./Images/user.png" alt="user" width="50" />
            )}
          </div>
        );
      }

      function App() {
        const msgData = [
          { msg: "hello chatbot", sender: "user" },
          { msg: "Hello! How can I assist you today ?", sender: "robot" },
          { msg: "Can you get me todays date", sender: "user" },
          { msg: "Today is September 23, 2023", sender: "robot" },
          { msg: "What is the temperature today?", sender: "user" },
          { msg: "The temperature today is 25°C", sender: "robot" },
        ];
        const parseChatMesgdata = msgData.map((message, index) => (
          <ChatMessage key={index} msg={message.msg} sender={message.sender} />
        ));
        return (
          <>
            <h1>Welcome to AI Bot</h1>
            <ChatInput />
            {parseChatMesgdata}
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
