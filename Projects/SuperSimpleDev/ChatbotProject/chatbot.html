<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      
      function ChatInput() {
        return (
          <>
            <input
              type="text"
              placeholder="Send a message to Chatbot..."
              size="30"
            />
            <button>Send</button>
          </>
        );
      }
      function ChatMessage(props) {
        const massage = props.msg;
        const sender = props.sender;
        if (sender === "user") {
          return (
            <div>
              {massage}
              <img src="./Images/user.png" alt="user" width="50" />
            </div>
          );
        } else if (sender === "robot") {
          return (
            <div>
              <img src="./Images/robot.png" alt="robot" width="50" />
              {massage}
            </div>
          );
        }
      }

      const app = (
        <>
          <h1>Welcome to AI Bot</h1>
          <ChatInput />
          <ChatMessage msg="hello chatbot" sender="user" />
          <ChatMessage msg="Hello! How can I assist you today ?" sender="robot"/>
          <ChatMessage msg="Can you get me todays date" sender="user" />
          <ChatMessage msg="Today is September 23, 2023" sender="robot" />
          <ChatMessage msg="What is the temperature today?" sender="user" />
          <ChatMessage msg="The temperature today is 25°C" sender="robot" />
        </>
      );

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(app);
    </script>
  </body>
</html>
