<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exchange Rate Finder</title>
</head>
<body>
  <h2>USD Exchange Rate Lookup</h2>
  <label for="amount">Amount: </label>
  <input type="number" id="amount" value="100" min="0" step="0.01">
  <br><br>
  <label for="fromCurrency">From Currency: </label>
  <select id="fromCurrency" aria-label="Select source currency">
    <option value="USD" selected>USD</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
    <option value="AUD">AUD</option>
    <option value="CAD">CAD</option>
    <option value="CHF">CHF</option>
    <option value="CNY">CNY</option>
    <option value="INR">INR</option>
  </select>
  <br><br>
  <label for="toCurrency">To Currency: </label>
  <select id="toCurrency" aria-label="Select target currency">
    <option value="EUR" selected>EUR</option>
    <option value="USD">USD</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
    <option value="AUD">AUD</option>
    <option value="CAD">CAD</option>
    <option value="CHF">CHF</option>
    <option value="CNY">CNY</option>
    <option value="INR">INR</option>
  </select>
  <button id="fetchBtn">Convert</button>
  <p id="resultText"></p>

  <script src="script.js"></script>
</body>
</html>
