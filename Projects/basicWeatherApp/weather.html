<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" >
         <button><img src="Images/search-icon.png" alt="Search" style="width: 24px; height: 24px;"></button>
        </div>
        <div class="weather">
            <img src="Images/weather-icon.png" alt="Weather" style="width: 100px; height: 100px;">
            <h2 class="temperature">25°C</h2>
            <p class="description">Sunny</p>
            <p class="city">City Name</p>
    
        </div>
    
</body>
</html>
