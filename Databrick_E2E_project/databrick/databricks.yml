bundle:
  name: fieldnote-sales-analytics

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for pipeline output
    default: workspace
  schema:
    description: Unity Catalog schema for pipeline output
    default: default
  source_table:
    description: Three-part table with daily sales metrics
    default: workspace.default.fieldnote_sales_source
  credit_source_table:
    description: Three-part source table containing German credit applications
    default: workspace.default.german_credit_data

targets:
  dev:
    mode: development
    default: true
